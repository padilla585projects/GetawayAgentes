name = "getaway-gateway"
main = "src/index.ts"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "getaway-db"
database_id = "020a7269-72fd-4b0a-a00e-f3160edbf059"

# KV para tokens y sesiones
[[kv_namespaces]]
binding = "KV"
id = "78ccd4f870d04b09b15e44a7e39f0ede"

# Durable Objects para WebSockets en tiempo real
[[durable_objects.bindings]]
name = "GATEWAY_HUB"
class_name = "GatewayHub"

[[migrations]]
tag = "v1"
new_classes = ["GatewayHub"]

[vars]
ENVIRONMENT = "development"
SECRET_KEY = "getaway-dev-secret-key-2024"

# Secrets (definir con: wrangler secret put <NOMBRE>)
# SECRET_KEY
# XAI_KEY         — console.x.ai (Grok) — proveedor por defecto
# OPENROUTER_KEY  — openrouter.ai
# GROQ_KEY        — console.groq.com/keys
# GEMINI_KEY      — ai.google.dev (Google AI Studio)
# OPENAI_KEY      — platform.openai.com/api-keys
# DEEPSEEK_KEY    — platform.deepseek.com/api_keys
# ANTHROPIC_KEY   — console.anthropic.com/settings/keys
