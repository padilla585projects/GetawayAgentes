name = "getaway-gateway"
main = "src/index.ts"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# Base de datos D1
[[d1_databases]]
binding = "DB"
database_name = "getaway-db"
database_id = "PENDIENTE-CREAR-CON-wrangler-d1-create"

# KV para tokens y sesiones
[[kv_namespaces]]
binding = "KV"
id = "PENDIENTE-CREAR-CON-wrangler-kv-namespace-create"

# Durable Objects para WebSockets en tiempo real
[[durable_objects.bindings]]
name = "GATEWAY_HUB"
class_name = "GatewayHub"

[[migrations]]
tag = "v1"
new_classes = ["GatewayHub"]

[vars]
ENVIRONMENT = "development"

# Secrets (definir con: wrangler secret put SECRET_KEY)
# SECRET_KEY
