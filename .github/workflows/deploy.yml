name: Deploy to Cloudflare

on:
  push:
    branches:
      - claude/add-claude-documentation-KdUQt
      - main

jobs:
  deploy-gateway:
    name: Deploy Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gateway dependencies
        run: cd gateway && npm install

      - name: Deploy gateway to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: gateway

      # Inyecta las claves de LLM como secrets (solo si están definidas en GitHub).
      - name: Set LLM secrets (OpenRouter)
        if: ${{ secrets.OPENROUTER_KEY != '' }}
        run: echo "${{ secrets.OPENROUTER_KEY }}" | npx wrangler secret put OPENROUTER_KEY
        workingDirectory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set LLM secrets (Groq)
        if: ${{ secrets.GROQ_KEY != '' }}
        run: echo "${{ secrets.GROQ_KEY }}" | npx wrangler secret put GROQ_KEY
        workingDirectory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set LLM secrets (Gemini)
        if: ${{ secrets.GEMINI_KEY != '' }}
        run: echo "${{ secrets.GEMINI_KEY }}" | npx wrangler secret put GEMINI_KEY
        workingDirectory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set LLM secrets (OpenAI)
        if: ${{ secrets.OPENAI_KEY != '' }}
        run: echo "${{ secrets.OPENAI_KEY }}" | npx wrangler secret put OPENAI_KEY
        workingDirectory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set LLM secrets (DeepSeek)
        if: ${{ secrets.DEEPSEEK_KEY != '' }}
        run: echo "${{ secrets.DEEPSEEK_KEY }}" | npx wrangler secret put DEEPSEEK_KEY
        workingDirectory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set LLM secrets (Anthropic)
        if: ${{ secrets.ANTHROPIC_KEY != '' }}
        run: echo "${{ secrets.ANTHROPIC_KEY }}" | npx wrangler secret put ANTHROPIC_KEY
        workingDirectory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: deploy-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: cd web && npm install

      - name: Build web
        run: cd web && npm run build
        env:
          NEXT_PUBLIC_GATEWAY_URL: https://getaway-gateway.alejandra-app.workers.dev
          NEXT_PUBLIC_WS_URL: wss://getaway-gateway.alejandra-app.workers.dev/ws

      - name: Deploy web to Cloudflare Workers
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        workingDirectory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_GATEWAY_URL: https://getaway-gateway.alejandra-app.workers.dev
          NEXT_PUBLIC_WS_URL: wss://getaway-gateway.alejandra-app.workers.dev/ws
